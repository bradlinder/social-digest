name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v4.7.0). Leave blank to auto-detect from social-digest.php'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Release Title (e.g. Social Digest 4.7.0). Leave blank to auto-generate'
        required: false
        default: ''
        type: string
      release_notes:
        description: 'Custom release notes / changelog (optional)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Create as a draft release'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean

  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: vars
        run: |
          # Extract version from social-digest.php header
          EXTRACTED_VER=$(grep -i "Version:" social-digest.php | head -n 1 | awk -F ':' '{print $2}' | tr -d ' \r\n')
          if [ -z "$EXTRACTED_VER" ]; then
            EXTRACTED_VER="1.0.0"
          fi
          
          # Set Tag Name
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${EXTRACTED_VER}"
          fi
          
          # Set Release Title
          if [ -n "${{ inputs.release_name }}" ]; then
            TITLE="${{ inputs.release_name }}"
          else
            TITLE="Social Digest ${EXTRACTED_VER}"
          fi
          
          echo "version=${EXTRACTED_VER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "title=${TITLE}" >> $GITHUB_OUTPUT

      - name: Package WordPress Plugin
        run: |
          # Create clean staging directory for WordPress plugin archive
          STAGING_DIR="build-stage/social-digest"
          mkdir -p "$STAGING_DIR"

          # Copy core plugin files
          cp social-digest.php "$STAGING_DIR/"
          cp readme.txt "$STAGING_DIR/"
          [ -f README.md ] && cp README.md "$STAGING_DIR/"
          [ -f LICENSE ] && cp LICENSE "$STAGING_DIR/"

          # Copy assets if present
          if [ -d "assets" ]; then
            cp -r assets "$STAGING_DIR/"
          fi

          # Create distribution zip
          cd build-stage
          zip -r ../social-digest.zip social-digest/
          cd ..
          
          echo "Plugin packaged successfully into social-digest.zip"
          unzip -l social-digest.zip

      - name: Generate Release Body
        id: release_notes
        run: |
          if [ -n "${{ inputs.release_notes }}" ]; then
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "body<<EOF" >> $GITHUB_OUTPUT
            echo "## Social Digest ${{ steps.vars.outputs.version }}"
            echo ""
            echo "### 📦 Installation"
            echo "1. Download \`social-digest.zip\` from the release assets below."
            echo "2. In your WordPress Admin Dashboard, navigate to **Plugins > Add New > Upload Plugin**."
            echo "3. Upload \`social-digest.zip\` and click **Activate**."
            echo "4. Go to **Settings > Social Digest** to configure your Bluesky and Mastodon feeds."
            echo ""
            echo "### 📄 Changelog"
            echo "See \`readme.txt\` for complete version changelog and notes."
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          TITLE="${{ steps.vars.outputs.title }}"
          
          # Save release notes to temporary file
          cat << 'EOF' > release_notes.md
          ${{ steps.release_notes.outputs.body }}
          EOF

          # Prepare optional flags
          FLAGS=()
          if [ "${{ inputs.draft }}" = "true" ]; then FLAGS+=("--draft"); fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then FLAGS+=("--prerelease"); fi

          echo "Publishing release $TAG ($TITLE)..."

          # Retry loop to handle transient GitHub API 500 "Unicorn" errors on asset uploads
          MAX_RETRIES=3
          RETRY_COUNT=0
          SUCCESS=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "Attempt $RETRY_COUNT of $MAX_RETRIES..."

            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" social-digest.zip --clobber && \
                 gh release edit "$TAG" --title "$TITLE" --notes-file release_notes.md "${FLAGS[@]}"; then
                SUCCESS=1
                break
              fi
            else
              if gh release create "$TAG" social-digest.zip \
                --title "$TITLE" \
                --notes-file release_notes.md \
                --target "${{ github.sha }}" \
                "${FLAGS[@]}"; then
                SUCCESS=1
                break
              fi
            fi

            echo "Upload/release creation hit transient error. Waiting 5s before retrying..."
            sleep 5
          done

          if [ $SUCCESS -ne 1 ]; then
            echo "Failed to publish GitHub release after $MAX_RETRIES attempts."
            exit 1
          fi
          echo "GitHub Release $TAG published successfully!"

